<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D PUBG GitHub Contribution Battle Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    #canvas-container { width: 1280px; height: 480px; position: relative; }
    canvas { display: block; width: 1280px !important; height: 480px !important; }

    /* Tactical HUD Overlay */
    .hud {
      position: absolute;
      top: 0; left: 0; width: 1280px; height: 480px;
      pointer-events: none;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Top Left: Sector & Operator */
    .hud-top-left {
      position: absolute;
      top: 14px; left: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(13, 17, 23, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 4px;
    }
    .hud-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .hud-bold { color: #f8fafc; font-weight: 700; }

    /* Top Right: Battle Telemetry */
    .hud-top-right {
      position: absolute;
      top: 14px; right: 24px;
      display: flex;
      gap: 16px;
      background: rgba(13, 17, 23, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 4px;
    }
    .hud-stat { color: #38bdf8; font-weight: 700; }

    /* Compass Tape at Top Center */
    .hud-compass {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 18px;
      border-radius: 4px;
      color: #cbd5e1;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* Bottom Sector Grid */
    .hud-bottom {
      position: absolute;
      bottom: 12px; left: 24px; right: 24px;
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-size: 9.5px;
    }
  </style>

  <!-- Import maps polyfill for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <!-- Tactical HUD -->
    <div class="hud">
      <div class="hud-top-left">
        <div class="hud-dot"></div>
        <span>OPERATOR: <span class="hud-bold">ISHAN GUPTA</span></span>
        <span style="color:#475569">|</span>
        <span>SECTOR: <span class="hud-bold">ERANGEL 52×7</span></span>
      </div>

      <div class="hud-compass">
        NW &nbsp;•&nbsp; 300 &nbsp;•&nbsp; 315 &nbsp;•&nbsp; <span style="color:#38bdf8">N</span> &nbsp;•&nbsp; 015 &nbsp;•&nbsp; 030 &nbsp;•&nbsp; NE
      </div>

      <div class="hud-top-right">
        <span>ALIVE: <span class="hud-stat" style="color:#10b981">2</span></span>
        <span>COMMITS: <span id="commit-stat" class="hud-stat">15</span></span>
        <span>ZONE: <span class="hud-stat" style="color:#f59e0b">HARDCORE</span></span>
      </div>

      <div class="hud-bottom">
        <span>GRID: 52 WEEKS ISOMETRIC MESH • ACES FILMIC TONE</span>
        <span>REAL-TIME COMMIT TELEMETRY • LIVE SEED</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { BattleArena } from './src/scene.js';

    let arena = null;

    async function init() {
      let data = null;
      try {
        const res = await fetch('./src/contributions.json');
        data = await res.json();
      } catch (e) {
        console.warn('Failed to load contributions.json, fallback active');
        data = { totalContributions: 15, weeks: [] };
      }

      if (data && data.totalContributions) {
        const el = document.getElementById('commit-stat');
        if (el) el.textContent = data.totalContributions;
      }

      const container = document.getElementById('canvas-container');
      arena = new BattleArena(container, data);

      // Expose deterministic seek function globally for Puppeteer
      window.seekToTime = (sec) => {
        if (arena) arena.seek(sec);
      };

      // Initial render at t = 0
      window.seekToTime(0);
      window.isReady = true;
      console.log('Battle Arena WebGL Ready!');
    }

    init();
  </script>
</body>
</html>
