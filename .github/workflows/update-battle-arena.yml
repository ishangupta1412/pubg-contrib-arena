name: Update 3D PUBG Battle Arena

on:
  schedule:
    - cron: '0 0 * * *' # Every midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies & Puppeteer Browser
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Fetch Live GitHub Contributions & Render 3D Scene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          npm run build

      - name: Commit & Push Updated Battle Animation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/contrib-battle.webp output/contrib-battle.gif src/contributions.json
          git diff --staged --quiet || git commit -m "chore(arena): daily update 3D PUBG contribution battle arena"
          git push
